# /etc/ec2-idle.conf - install_guest.sh writes this file. Edit with: sudoedit /etc/ec2-idle.conf
# The instance ID and Region come from instance metadata, so they are not needed here.

# stop = really stop the instance. dry-run = only log what would happen.
IDLE_MODE=stop

# Minutes of idle time before the warning email, and before the stop.
WARN_MINUTES=30
STOP_MINUTES=45

# Optional. SNS topic for emails (AlertTopicArn stack output). Empty = no emails.
SNS_TOPIC_ARN=

# Optional. Your wake page link (WakePageUrl stack output). It goes into the emails.
WAKE_PAGE_URL=

# Optional. Friendly name for emails, for example ubuntu-cp. Empty = the instance's
# Name tag if instance metadata tags are enabled, otherwise the instance ID.
INSTANCE_NAME=

# At most one warning email per this many minutes. One "stopped" email is sent per stop.
WARN_EMAIL_GAP_MINUTES=60

# Failed warning emails in a row before the instance stops without one.
WARN_RETRIES=3

# Optional. Absolute path to a root-owned executable that reports background work.
# Exit 0 = busy (keep running), 1 = idle, anything else = unknown (restarts the idle clock).
WORK_PROBE=
