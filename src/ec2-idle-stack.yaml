AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  EC2 idle stop and wake for one instance. Wake page (Lambda Function URL), optional
  work-hours start (EventBridge Scheduler), idle warning email (SNS) and a backup alarm.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: "Basic (instance, PIN and email)"}
        Parameters: [InstanceId, WakePin, NotificationEmail]
      - Label: {default: Advanced (all optional)}
        Parameters: [WorkHoursStart, WarnMinutes, StopMinutes, BackupAlarmHours, EnableSessionManager,
                     InstanceRoleName, EbsKmsKeyArn, SshUser]

Parameters:
  InstanceId:
    Type: AWS::EC2::Instance::Id
    Description: The EBS-backed instance that stops when idle and wakes on request.
  InstanceRoleName:
    Type: String
    Default: ""
    AllowedPattern: "^[\\w+=,.@-]{0,64}$"
    Description: >-
      Name of the IAM role the instance already uses, if any. The stack adds its policy to
      that role. Leave empty to create a new role and instance profile.
  EbsKmsKeyArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws[a-z-]*:kms:[a-z0-9-]+:\\d{12}:key/[0-9a-f-]+$"
    Description: >-
      Only if the instance's EBS volumes use a customer managed KMS key (discover.sh tells
      you). Lets the wake page and schedule start an instance with those volumes.
  SshUser:
    Type: String
    Default: ubuntu
    AllowedPattern: "^[a-z_][a-z0-9_-]{0,31}$"
    Description: Login name shown in the SSH command on the wake page.
  WakePin:
    Type: String
    NoEcho: true
    MinLength: 4
    MaxLength: 64
    AllowedPattern: "^[A-Za-z0-9]{4,64}$"
    ConstraintDescription: 4 to 64 letters and numbers, for example 4821.
    Description: >-
      Your PIN for the wake page, 4 to 64 letters and numbers (for example 4821). 5 wrong tries lock
      the page for 15 minutes. It can only start the instance. Save it in your password manager.
  NotificationEmail:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    Description: Optional. Email for idle warnings and alarms. Confirm the subscription email.
  WarnMinutes:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 1440
    Description: Optional. Idle minutes before the warning email. It goes into the install command (GuestInstallCommand).
  StopMinutes:
    Type: Number
    Default: 45
    MinValue: 2
    MaxValue: 1440
    Description: >-
      Optional. Idle minutes before the instance stops. It must be more than WarnMinutes, and the
      installer checks that. It goes into the install command (GuestInstallCommand).
  EnableSessionManager:
    Type: String
    AllowedValues: ["no", "yes"]
    Default: "no"
    Description: >-
      Optional. yes = a browser shell through AWS Systems Manager Session Manager, with no SSH port,
      key or security group change. It adds the AmazonSSMManagedInstanceCore policy to the role this
      stack creates, so leave InstanceRoleName empty. With your own role, attach that policy yourself.
  WorkHoursStart:
    Type: String
    Default: ""
    AllowedPattern: "^$|^cron\\([^|]+\\)(\\|[A-Za-z_]+(/[A-Za-z0-9_+-]+){0,2})?$"
    Description: >-
      Optional. When to start the instance automatically: a cron expression, then optionally a | and a time zone.
      Example for 9:00 on weekdays in India: cron(0 9 ? * MON-FRI *)|Asia/Kolkata. Without a time zone it
      runs in UTC. Empty = no schedule.
  BackupAlarmHours:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 24
    Description: >-
      Optional, off by default. A backup in case the idle timer silently stops working: alarm
      after this many hours of running below 3 percent CPU (try 4). 0 = no alarm. Needs
      NotificationEmail. A long quiet session, such as an open editor, can also trigger it.

Rules:
  SessionManagerNeedsTheNewRole:
    RuleCondition: !Equals [!Ref EnableSessionManager, "yes"]
    Assertions:
      - Assert: !Equals [!Ref InstanceRoleName, ""]
        AssertDescription: >-
          EnableSessionManager only works when this stack creates the role. Leave InstanceRoleName empty,
          or attach the AmazonSSMManagedInstanceCore policy to your own role and set EnableSessionManager to no.

Conditions:
  UseSessionManager: !Equals [!Ref EnableSessionManager, "yes"]
  HasEmail: !Not [!Equals [!Ref NotificationEmail, ""]]
  CreateRole: !Equals [!Ref InstanceRoleName, ""]
  HasSchedule: !Not [!Equals [!Ref WorkHoursStart, ""]]
  AlarmEnabled: !Not [!Equals [!Ref BackupAlarmHours, "0"]]
  CreateAlarm: !And [!Condition AlarmEnabled, !Condition HasEmail]
  HasKmsKey: !Not [!Equals [!Ref EbsKmsKeyArn, ""]]

Resources:
  # Idle warning email -------------------------------------------------------
  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasEmail
    Properties:
      DisplayName: EC2 idle
      Subscription:
        - Protocol: email
          Endpoint: !Ref NotificationEmail

  # Permissions for the watcher inside the instance -------------------------
  GuestRole:
    Type: AWS::IAM::Role
    Condition: CreateRole
    Properties:
      Description: Instance role for the EC2 idle watcher.
      ManagedPolicyArns: !If
        - UseSessionManager
        - [!Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"]
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole

  GuestInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: CreateRole
    Properties:
      Roles: [!Ref GuestRole]

  GuestPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Lets the EC2 idle watcher stop its own instance and send the idle warning.
      Roles: [!If [CreateRole, !Ref GuestRole, !Ref InstanceRoleName]]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StopThisInstance
            Effect: Allow
            Action: ec2:StopInstances
            Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}
          - !If
            - HasEmail
            - Sid: SendIdleWarning
              Effect: Allow
              Action: sns:Publish
              Resource: !Ref AlertTopic
            - !Ref AWS::NoValue

  # Wake page ---------------------------------------------------------------
  WakeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  # Counts wrong PINs so a short PIN cannot be guessed. Pay per request, so it costs about nothing.
  WakeLockTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires
        Enabled: true

  WakeFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets the wake page read and start one EC2 instance.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: wake-one-instance
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: "*"
              - Effect: Allow
                Action: ec2:StartInstances
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt WakeLogGroup.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:DeleteItem]
                Resource: !GetAtt WakeLockTable.Arn
              - !If
                - HasKmsKey
                - Sid: StartWithEncryptedVolumes
                  Effect: Allow
                  Action: [kms:CreateGrant, kms:DescribeKey]
                  Resource: !Ref EbsKmsKeyArn
                  Condition:
                    Bool:
                      kms:GrantIsForAWSResource: true
                - !Ref AWS::NoValue

  WakeFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Wake page for one EC2 instance.
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.lambda_handler
      MemorySize: 128
      # Long enough for a terminal "wake and wait" request (up to 150 seconds).
      Timeout: 180
      Role: !GetAtt WakeFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref WakeLogGroup
      Environment:
        Variables:
          INSTANCE_ID: !Ref InstanceId
          WAKE_PIN: !Ref WakePin
          LOCK_TABLE: !Ref WakeLockTable
          SSH_USER: !Ref SshUser
      Code:
        # Keep identical to wake_ec2.py. test_workflow.py checks this.
        ZipFile: |
          """Wake page and wake API for one EC2 instance, served by a Lambda Function URL.

          Browsers get a web page. Terminals and code POST to the same URL:

              curl -d pin=YOUR_PIN -d action=wake URL     (waits, then prints readable progress)
              curl -d pin=YOUR_PIN URL                    (status only)

          Form posts and "accept: text/plain" get "name: value" text. JSON posts and
          "accept: application/json" get JSON. The PIN is compared with WAKE_PIN. A few
          wrong tries lock the page for a while (state kept in a small DynamoDB table),
          so even a short PIN cannot be guessed. The PIN can only start the instance.
          """

          import base64
          import hmac
          import json
          import os
          import time
          import urllib.parse

          import boto3
          from botocore.exceptions import ClientError

          ec2 = boto3.client("ec2")
          ddb = boto3.client("dynamodb")

          POLL_SECONDS = 4
          MAX_WAIT_SECONDS = 150
          TEXT_WAKE_WAIT = 120
          ENDED = {"shutting-down", "terminated"}

          HEADERS = {
              "cache-control": "no-store",
              "referrer-policy": "no-referrer",
              "x-content-type-options": "nosniff",
              "x-frame-options": "DENY",
          }

          HELP = """EC2 wake API

          Wake and wait until ready (prints progress, IP and SSH command):
            curl -d pin=YOUR_PIN -d action=wake {url}

          Status only:
            curl -d pin=YOUR_PIN {url}

          Options: action=status|wake, wait=SECONDS (0-150, text wake default 120),
          format=text|json. Windows PowerShell: use curl.exe, or
            Invoke-RestMethod -Method Post -Uri {url} -Body @{{pin='YOUR_PIN'; action='wake'}}
          Exit-code friendly: add curl -f to fail on a wrong PIN or a blocked wake.
          A few wrong PIN tries lock the page for a while.
          One-tap bookmark: {url}#YOUR_PIN
          """

          PAGE = """<!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Wake EC2</title>
          <style>
          :root { color-scheme: light dark; --bg: #f6f7f9; --card: #fff; --text: #16191f; --muted: #5f6b7a;
            --accent: #0972d3; --ok: #037f0c; --warn: #8d6605; --bad: #d91515; --line: #d1d5db; }
          @media (prefers-color-scheme: dark) { :root { --bg: #0f1419; --card: #1a2029; --text: #e9ebed;
            --muted: #9ba7b6; --accent: #539fe5; --ok: #29ad32; --warn: #e0ca57; --bad: #ff5d64; --line: #414d5c; } }
          * { box-sizing: border-box; }
          body { margin: 0; background: var(--bg); color: var(--text);
            font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
          main { max-width: 440px; margin: 48px auto; padding: 0 16px; }
          .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
          h1 { font-size: 22px; margin: 0 0 4px; }
          p { margin: 0 0 16px; color: var(--muted); }
          label { display: block; font-weight: 600; margin-bottom: 6px; }
          input[type=password] { width: 100%; padding: 10px 12px; font: inherit; color: inherit;
            background: transparent; border: 1px solid var(--line); border-radius: 8px; }
          .row { display: flex; gap: 8px; margin-top: 12px; }
          button { flex: 1; padding: 10px; font: inherit; font-weight: 600; border-radius: 8px; cursor: pointer;
            border: 1px solid var(--accent); background: var(--accent); color: #fff; }
          button.secondary { background: transparent; color: var(--accent); }
          button:disabled { opacity: .6; cursor: wait; }
          .remember { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-weight: 400;
            color: var(--muted); }
          #out { margin-top: 20px; display: none; }
          .state { font-size: 20px; font-weight: 700; }
          .running { color: var(--ok); } .pending, .stopping { color: var(--warn); }
          .stopped, .error { color: var(--bad); }
          ol { margin: 8px 0 0; padding-left: 20px; color: var(--muted); font-size: 14px; }
          code { display: block; margin-top: 8px; padding: 10px; border-radius: 8px; border: 1px solid var(--line);
            overflow-wrap: anywhere; font-size: 14px; }
          </style>
          </head>
          <body>
          <main>
          <div class="card">
          <h1>Wake EC2</h1>
          <p>Start your workspace from any browser. It stops again by itself when idle.</p>
          <form id="form">
          <label for="pin">PIN</label>
          <input id="pin" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
          <label class="remember"><input id="remember" type="checkbox"> Remember on this device</label>
          <div class="row">
          <button id="wake" type="submit">Wake</button>
          <button id="status" type="button" class="secondary">Check status</button>
          </div>
          </form>
          <div id="out" aria-live="polite">
          <div id="state" class="state"></div>
          <div id="detail"></div>
          <ol id="log"></ol>
          <code id="ssh" hidden></code>
          </div>
          </div>
          </main>
          <script>
          const $ = (id) => document.getElementById(id);
          let timer = null, began = 0, lastState = "";
          try { const saved = localStorage.getItem("wakePin"); if (saved) { $("pin").value = saved; $("remember").checked = true; } } catch (e) {}

          function note(text) {
            const item = document.createElement("li");
            item.textContent = Math.round((Date.now() - began) / 1000) + "s " + text;
            $("log").appendChild(item);
          }

          function show(data, failed) {
            $("out").style.display = "block";
            const state = failed ? "error" : data.state;
            $("state").textContent = failed ? (data.error || "Request failed") : state;
            $("state").className = "state " + state;
            const ip = data.publicIp || data.privateIp;
            $("detail").textContent = data.message || (ip ? "IP address " + ip : "");
            if (!failed && state !== lastState) { note(state); lastState = state; }
            $("ssh").hidden = !(data.ready && data.ssh);
            if (data.ready && data.ssh) $("ssh").textContent = data.ssh;
          }

          async function call(action) {
            const pin = $("pin").value.trim();
            if (!pin) { $("pin").focus(); return null; }
            try {
              if ($("remember").checked) localStorage.setItem("wakePin", pin); else localStorage.removeItem("wakePin");
            } catch (e) {}
            const response = await fetch(location.pathname, {
              method: "POST", headers: { "content-type": "application/json", "accept": "application/json" },
              body: JSON.stringify({ action, pin, wait: 0 }),
            });
            let data = {};
            try { data = await response.json(); } catch (e) { data = { error: "Unexpected response" }; }
            const failed = [400, 403, 429].includes(response.status) || response.status >= 500;
            show(data, failed);
            return failed ? null : data;
          }

          async function run(action, attempt = 0) {
            clearTimeout(timer);
            if (attempt === 0) { began = Date.now(); lastState = ""; $("log").textContent = ""; }
            $("wake").disabled = $("status").disabled = true;
            try {
              const data = await call(action);
              if (data && action === "wake" && !data.ready && attempt < 60
                  && data.state !== "terminated" && data.state !== "shutting-down") {
                timer = setTimeout(() => run("wake", attempt + 1), 5000);
              } else if (data && data.ready && action === "wake") {
                note("ready");
              }
            } catch (e) {
              show({ error: "Network error. Try again." }, true);
            } finally {
              $("wake").disabled = $("status").disabled = false;
            }
          }

          $("form").addEventListener("submit", (event) => { event.preventDefault(); run("wake"); });
          $("status").addEventListener("click", () => run("status"));

          // One-tap bookmark: https://.../#YOUR_PIN wakes at once. The part after # is never sent to AWS.
          if (location.hash.length > 1) {
            let pin = "";
            try { pin = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
            history.replaceState(null, "", location.pathname + location.search);
            if (pin) { $("pin").value = pin; $("remember").checked = true; run("wake"); }
          }
          </script>
          </body>
          </html>
          """


          # Requests and replies -----------------------------------------------------

          def lowered(headers):
              return {name.lower(): value for name, value in (headers or {}).items()}


          def read_request(event):
              """Return a dict of request fields from a JSON or form body."""
              body = event.get("body") or ""
              if event.get("isBase64Encoded"):
                  # Function URLs hand over form bodies (curl -d) base64-encoded.
                  body = base64.b64decode(body).decode("utf-8")
              headers = lowered(event.get("headers"))
              kind = headers.get("content-type", "")
              if "json" in kind or body.lstrip().startswith("{"):
                  fields = json.loads(body) if body.strip() else {}
                  if not isinstance(fields, dict):
                      raise ValueError("JSON object expected")
                  fields.setdefault("_body", "json")
              else:
                  fields = {name: values[-1] for name, values in urllib.parse.parse_qs(body).items()}
                  fields["_body"] = "form"
              fields["pin"] = str(fields.get("pin") or "").strip()[:128]
              return fields, headers


          def wants_text(fields, headers):
              chosen = str(fields.get("format", "")).lower()
              if chosen in {"text", "json"}:
                  return chosen == "text"
              accept = headers.get("accept", "")
              if "application/json" in accept:
                  return False
              if "text/plain" in accept:
                  return True
              return fields.get("_body") == "form"


          def as_text(data):
              if "error" in data:
                  return f"error: {data['error']}\n"
              lines = [f"state: {data['state']}", f"ready: {'yes' if data.get('ready') else 'no'}"]
              for label, name in (("message", "message"), ("public_ip", "publicIp"),
                                  ("private_ip", "privateIp"), ("ssh", "ssh")):
                  if data.get(name):
                      lines.append(f"{label}: {data[name]}")
              if data.get("progress"):
                  lines.append("progress:")
                  lines += [f"  {step['seconds']:>3}s  {step['event']}" for step in data["progress"]]
              return "\n".join(lines) + "\n"


          def reply(status, data, text=False, extra=None):
              kind = "text/plain; charset=utf-8" if text else "application/json"
              return {"statusCode": status, "body": as_text(data) if text else json.dumps(data),
                      "headers": {**HEADERS, **(extra or {}), "content-type": kind}}


          def plural(count, word):
              if count == 1:
                  return f"{count} {word}"
              return f"{count} {word[:-1]}ies" if word.endswith("y") else f"{count} {word}s"


          def page():
              csp = ("default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; "
                     "connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'")
              return {"statusCode": 200, "body": PAGE, "headers": {
                  **HEADERS, "content-type": "text/html; charset=utf-8", "content-security-policy": csp}}


          def help_text(headers):
              url = f"https://{headers.get('host', 'YOUR-WAKE-URL')}/"
              return {"statusCode": 200, "body": HELP.format(url=url),
                      "headers": {**HEADERS, "content-type": "text/plain; charset=utf-8"}}


          def pin_matches(pin):
              expected = os.environ.get("WAKE_PIN", "")
              if not expected or not pin:
                  return False
              return hmac.compare_digest(str(pin).encode("utf-8"), expected.encode("utf-8"))


          # Lockout: a few wrong PINs lock the page, so a short PIN cannot be guessed ------

          LOCK_KEY = {"id": {"S": "wake"}}


          def lock_settings():
              tries = int(os.environ.get("MAX_WRONG_TRIES", "5"))
              seconds = int(os.environ.get("LOCK_MINUTES", "15")) * 60
              return tries, seconds


          def check_lock():
              """Return (seconds left on a lock, wrong tries so far). Raises if the store fails."""
              table = os.environ.get("LOCK_TABLE")
              if not table:
                  return 0, 0
              item = ddb.get_item(TableName=table, Key=LOCK_KEY, ConsistentRead=True).get("Item", {})
              until = int(item.get("until", {}).get("N", "0"))
              fails = int(item.get("fails", {}).get("N", "0"))
              return max(0, until - int(time.time())), fails


          def record_failure():
              """Count one wrong PIN. Return (seconds now locked for, tries left before a lock)."""
              table = os.environ.get("LOCK_TABLE")
              if not table:
                  return 0, None
              tries, seconds = lock_settings()
              now = int(time.time())
              expires = {"N": str(now + 86400)}
              attrs = ddb.update_item(
                  TableName=table, Key=LOCK_KEY, ReturnValues="ALL_NEW",
                  UpdateExpression="ADD #f :one SET #s = if_not_exists(#s, :now), #e = :exp",
                  ExpressionAttributeNames={"#f": "fails", "#s": "since", "#e": "expires"},
                  ExpressionAttributeValues={":one": {"N": "1"}, ":now": {"N": str(now)}, ":exp": expires},
              )["Attributes"]
              fails = int(attrs["fails"]["N"])
              if now - int(attrs["since"]["N"]) > seconds:  # old wrong tries expired: count afresh
                  ddb.update_item(
                      TableName=table, Key=LOCK_KEY, UpdateExpression="SET #f = :one, #s = :now",
                      ExpressionAttributeNames={"#f": "fails", "#s": "since"},
                      ExpressionAttributeValues={":one": {"N": "1"}, ":now": {"N": str(now)}})
                  fails = 1
              if fails >= tries:
                  ddb.update_item(
                      TableName=table, Key=LOCK_KEY, UpdateExpression="SET #u = :until, #f = :zero, #e = :exp REMOVE #s",
                      ExpressionAttributeNames={"#u": "until", "#f": "fails", "#e": "expires", "#s": "since"},
                      ExpressionAttributeValues={":until": {"N": str(now + seconds)}, ":zero": {"N": "0"},
                                                 ":exp": {"N": str(now + seconds + 86400)}})
                  return seconds, 0
              return 0, tries - fails


          def clear_failures():
              ddb.delete_item(TableName=os.environ["LOCK_TABLE"], Key=LOCK_KEY)


          def locked_reply(seconds, text):
              minutes = max(1, -(-seconds // 60))
              return reply(429, {"error": f"Too many wrong PIN tries. Try again in {plural(minutes, 'minute')}.",
                                 "retryAfterSeconds": seconds}, text, {"retry-after": str(seconds)})


          def wait_seconds(fields, text, action, context):
              raw = fields.get("wait")
              if raw in (None, ""):
                  seconds = TEXT_WAKE_WAIT if text and action == "wake" else 0
              elif str(raw).lower() in {"yes", "true"}:
                  seconds = MAX_WAIT_SECONDS
              else:
                  seconds = int(float(raw))
              seconds = max(0, min(seconds, MAX_WAIT_SECONDS))
              if context is not None:
                  seconds = min(seconds, max(0, context.get_remaining_time_in_millis() // 1000 - 10))
              return seconds


          # EC2 --------------------------------------------------------------------

          def describe(instance_id):
              return ec2.describe_instances(InstanceIds=[instance_id])["Reservations"][0]["Instances"][0]


          def summary(instance, state):
              public, private = instance.get("PublicIpAddress"), instance.get("PrivateIpAddress")
              address = public or private
              ready = state == "running" and bool(address)
              data = {"state": state, "ready": ready, "publicIp": public, "privateIp": private,
                      "sshUser": os.environ.get("SSH_USER", "ubuntu")}
              if ready:
                  data["ssh"] = f"ssh {data['sshUser']}@{address}"
              return data


          def wake(instance_id, budget):
              """Start the instance if needed and wait up to budget seconds until it is ready."""
              began = time.monotonic()
              progress, last, started = [], None, False

              def note(event):
                  progress.append({"seconds": int(time.monotonic() - began), "event": event})

              while True:
                  instance = describe(instance_id)
                  state = instance["State"]["Name"]
                  if state != last:
                      note(state)
                      last = state
                  if state == "stopped" and not started:
                      try:
                          result = ec2.start_instances(InstanceIds=[instance_id])
                          started = True
                          state = last = result["StartingInstances"][0]["CurrentState"]["Name"]
                          note(f"start requested, now {state}")
                      except ClientError as error:
                          if error.response["Error"]["Code"] != "IncorrectInstanceState":
                              raise
                          note("state changed during start, retrying")
                  data = summary(instance, state)
                  if data["ready"] or state in ENDED:
                      break
                  if time.monotonic() - began + POLL_SECONDS > budget:
                      break
                  time.sleep(POLL_SECONDS)
              if data["ready"]:
                  note("ready")
              elif state == "stopping":
                  data["message"] = "The instance is still stopping. It will start once stopped; retry."
              elif state not in ENDED:
                  data["message"] = "Starting. This usually takes under a minute."
              return {**data, "progress": progress}


          def lambda_handler(event, context):
              method = event.get("requestContext", {}).get("http", {}).get("method")
              headers = lowered(event.get("headers"))
              if method == "GET":
                  return page() if "text/html" in headers.get("accept", "") else help_text(headers)
              if method != "POST":
                  return reply(405, {"error": "Use GET for the page or POST for the API"})
              try:
                  fields, headers = read_request(event)
              except (ValueError, UnicodeDecodeError):
                  return reply(400, {"error": "Send a JSON or form body"})
              text = wants_text(fields, headers)
              try:
                  locked, previous_fails = check_lock()
              except Exception as error:  # fail closed: without the counter, nobody may guess
                  print(f"Lock check failed: {error}")
                  return reply(503, {"error": "Temporarily unavailable. Start the instance from the EC2 console."}, text)
              if locked:
                  print("Rejected request: page is locked after wrong PINs")
                  return locked_reply(locked, text)
              if not pin_matches(fields["pin"]):
                  print("Rejected request: wrong PIN")
                  try:
                      locked, left = record_failure()
                  except Exception as error:
                      print(f"Could not count the wrong PIN: {error}")
                      locked, left = 0, None
                  if locked:
                      return locked_reply(locked, text)
                  message = "Wrong PIN"
                  if left:
                      message += f". {plural(left, 'try')} left before a {lock_settings()[1] // 60}-minute lock."
                  return reply(403, {"error": message}, text)
              if previous_fails:
                  try:
                      clear_failures()
                  except Exception as error:
                      print(f"Could not reset the wrong PIN count: {error}")
              action = str(fields.get("action", "status")).lower()
              if action not in {"status", "wake"}:
                  return reply(400, {"error": "action must be status or wake"}, text)
              try:
                  budget = wait_seconds(fields, text, action, context)
              except (ValueError, OverflowError):
                  return reply(400, {"error": "wait must be a number of seconds"}, text)

              instance_id = os.environ["INSTANCE_ID"]
              if action == "status":
                  instance = describe(instance_id)
                  data = summary(instance, instance["State"]["Name"])
                  print(f"status: {data['state']}")
                  return reply(200, data, text)

              data = wake(instance_id, budget)
              print(f"wake: {data['state']} ready={data['ready']} after {data['progress'][-1]['seconds']}s")
              if data["ready"]:
                  status = 200
              elif data["state"] in ENDED or data["state"] == "stopping":
                  status = 409
              else:
                  status = 202
              return reply(status, data, text)

  WakeUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt WakeFunction.Arn

  WakeUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WakeFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  WakeInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WakeFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # Optional work-hours start -----------------------------------------------
  SchedulerRole:
    Type: AWS::IAM::Role
    Condition: HasSchedule
    Properties:
      Description: Lets EventBridge Scheduler start one EC2 instance.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: start-one-instance
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ec2:StartInstances
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}
              - !If
                - HasKmsKey
                - Sid: StartWithEncryptedVolumes
                  Effect: Allow
                  Action: [kms:CreateGrant, kms:DescribeKey]
                  Resource: !Ref EbsKmsKeyArn
                  Condition:
                    Bool:
                      kms:GrantIsForAWSResource: true
                - !Ref AWS::NoValue

  WorkHoursSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: HasSchedule
    Properties:
      Description: Starts the EC2 instance at the start of work hours.
      # WorkHoursStart is "cron(...)" or "cron(...)|Time/Zone". Without a zone this gives UTC.
      ScheduleExpression: !Select [0, !Split ["|", !Ref WorkHoursStart]]
      ScheduleExpressionTimezone: !Select [1, !Split ["|", !Join ["|", [!Ref WorkHoursStart, "UTC"]]]]
      FlexibleTimeWindow: {Mode: "OFF"}
      State: ENABLED
      Target:
        Arn: !Sub arn:${AWS::Partition}:scheduler:::aws-sdk:ec2:startInstances
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"InstanceIds": ["${InstanceId}"]}'
        RetryPolicy:
          MaximumRetryAttempts: 3
          MaximumEventAgeInSeconds: 900

  # Optional backup alarm ---------------------------------------------------
  BackupAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateAlarm
    Properties:
      AlarmDescription: !Sub >-
        EC2 ${InstanceId} has been running quietly (under 3 percent CPU)
        for ${BackupAlarmHours} hours. Either a session or editor window is still open, or the
        idle timer is not installed or not working. On the instance, check with
        systemctl list-timers ec2-idle.timer. This can also fire right after the stack is
        created (or this alarm turned on) if the instance was already idle.
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: InstanceId
          Value: !Ref InstanceId
      Statistic: Average
      Period: 3600
      EvaluationPeriods: !Ref BackupAlarmHours
      Threshold: 3
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

Outputs:
  WakePageUrl:
    Description: Open in any browser or phone to wake the instance. Bookmark it.
    Value: !GetAtt WakeUrl.FunctionUrl
  TerminalWakeCommand:
    Description: Wake from any terminal (macOS, Linux, Windows cmd or curl.exe). Replace YOUR_PIN. Prints progress and the SSH command.
    Value: !Sub "curl -d pin=YOUR_PIN -d action=wake ${WakeUrl.FunctionUrl}"
  OneTapBookmark:
    Description: Bookmark this, with YOUR_PIN replaced, to wake with one tap. The part after # is never sent to AWS.
    Value: !Sub "${WakeUrl.FunctionUrl}#YOUR_PIN"
  AlertTopicArn:
    Condition: HasEmail
    Description: SNS topic for the idle warning and stopped emails.
    Value: !Ref AlertTopic
  GuestInstallCommand:
    Description: Run ON THE INSTANCE (not your computer), inside ec2-idle-stop-wake/src after git clone.
    Value: !If
      - HasEmail
      - !Sub "bash install_guest.sh --topic ${AlertTopic} --wake-url ${WakeUrl.FunctionUrl} --warn ${WarnMinutes} --stop ${StopMinutes}"
      - !Sub "bash install_guest.sh --wake-url ${WakeUrl.FunctionUrl} --warn ${WarnMinutes} --stop ${StopMinutes}"
  ConnectInBrowser:
    Description: Opens the EC2 connect page for the instance. With EnableSessionManager there is a Session Manager tab that needs no SSH port.
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/ec2/home?region=${AWS::Region}#ConnectToInstance:instanceId=${InstanceId}"
  TemporarySshCommand:
    Description: >-
      Only if you have no other way onto the instance. Run it in CloudShell, from the src folder after git clone.
      It opens port 22 for your current IP only, for 30 minutes. Run the same command with close instead of open
      when you are done.
    Value: !Sub "bash temp_ssh.sh open ${InstanceId} --region ${AWS::Region}"
  AttachRoleCommand:
    Condition: CreateRole
    Description: Run once in CloudShell to give the instance its new role.
    Value: !Sub "aws ec2 associate-iam-instance-profile --instance-id ${InstanceId} --iam-instance-profile Name=${GuestInstanceProfile}"
